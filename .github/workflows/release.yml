name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 v1.4.0（留空则使用仓库最新 tag；不会把分支名当版本号）'
        required: false

permissions:
  contents: write

jobs:
  # 发布前先跑 lint + 链接检查，作为质量门禁
  qa:
    uses: ./.github/workflows/docs-qa.yml

  release:
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${INPUT_VERSION}" ]; then
              V="${INPUT_VERSION}"
            else
              # 手动触发没有“刚推送的 tag”，回退到最新 tag，避免把分支名当版本号
              V="$(git describe --tags --abbrev=0)"
            fi
          else
            V="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$V" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like vX.Y.Z (got '$V')"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Ensure tag exists
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/${V}" >/dev/null 2>&1; then
            git tag -a "${V}" -m "${V}"
            git push origin "${V}"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: md-doc-optimizer ${{ steps.version.outputs.version }}
          generate_release_notes: true
