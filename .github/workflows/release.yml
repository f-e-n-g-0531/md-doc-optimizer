name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 v1.4.0（留空使用当前提交最近可达 tag）'
        required: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.target.outputs.version }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve and validate target
        id: target
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: node scripts/release-target.mjs

  qa:
    needs: resolve
    uses: ./.github/workflows/docs-qa.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  release:
    needs: [resolve, qa]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Ensure tag matches validated commit
        env:
          V: ${{ needs.resolve.outputs.version }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --force origin 'refs/tags/*:refs/tags/*'
          if git show-ref --verify --quiet "refs/tags/${V}"; then
            ACTUAL="$(git rev-parse "refs/tags/${V}^{commit}")"
            if [ "$ACTUAL" != "$SHA" ]; then
              echo "::error::Release tag changed after QA"; exit 1
            fi
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$V" "$SHA" -m "$V"
            git push origin "refs/tags/${V}"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.version }}
          target_commitish: ${{ needs.resolve.outputs.sha }}
          name: md-doc-optimizer ${{ needs.resolve.outputs.version }}
          generate_release_notes: true
