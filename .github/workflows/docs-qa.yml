name: docs-qa

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "**.markdown"
      - ".markdownlint.yml"
      - "lychee.toml"
      - ".github/workflows/docs-qa.yml"
      - "scripts/**"
      - "**.json"
  pull_request:
    paths:
      - "**.md"
      - "**.markdown"
      - ".markdownlint.yml"
      - "lychee.toml"
      - ".github/workflows/docs-qa.yml"
      - "scripts/**"
      - "**.json"

  workflow_call:

permissions:
  contents: read

jobs:
  docs-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md"

      - name: docs consistency
        run: node scripts/check-docs.mjs

      - name: validate report schema
        run: npx --yes ajv-cli@5 validate --spec=draft2020 -s references/report.schema.json -d examples/report.sample.json

      - name: check-links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config ./lychee.toml --no-progress '**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
